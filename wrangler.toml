name = "isntagram"
main = "worker/src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Routes are passed to `wrangler deploy` (see worker/package.json) rather than set here:
# with routes configured, `wrangler dev` rewrites every request's host, which breaks
# local testing of {handle}.localhost image subdomains.

[vars]
APP_HOST         = "isntagram.au"
SEED_USER_EMAIL  = "simonhildebrandt@gmail.com"
SEED_QUOTA_BYTES = "1000000000"

# The Worker runs first for every request, so image subdomains never fall through to app assets.
[assets]
directory          = "frontend/public"
binding            = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first   = true

[[d1_databases]]
binding        = "DB"
database_name  = "isntagram"
database_id    = "00000000-0000-0000-0000-000000000000" # replace with the id from `wrangler d1 create isntagram`
migrations_dir = "worker/migrations"

[observability.logs]
enabled = true
